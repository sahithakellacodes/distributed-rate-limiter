services:
  gateway:
    build:
      context: .
      target: gateway
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - BACKEND_BASE_URL=http://backend:8081
      - REDIS_ADDR=redis:6379

  backend:
    build:
      context: .
      target: backend
    ports:
      - "8081:8081"
  
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
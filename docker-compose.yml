services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    ports:
      - "8080:8080"
    environment:
      - BACKEND_BASE_URL=http://backend:8081
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8081:8081"